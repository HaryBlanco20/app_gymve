<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5B21B6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymVe" />
  <link rel="manifest" href="/static/manifest.webmanifest?v=20250930" />
  <link rel="apple-touch-icon" href="/static/icon-192.png?v=20250930" />
  <title>{% block title %}GymVe{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css?v=20250930" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="mesh-bg" aria-hidden="true"></div>
  <div class="app-shell {% block shell_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </div>
  <script src="/static/app.js?v=20250930" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
