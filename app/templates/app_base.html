<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymVe" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="icon" href="/static/icon-192.png" />
  <title>{% block title %}GymVe{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="stylesheet" href="/static/app-gym.css?v=20260930b" />
  {% block head %}{% endblock %}
</head>
<body class="gym-app">
  <div class="gym-shell">
    <header class="gym-topbar">
      <div class="gym-brand">
        <span class="gym-logo">GV</span>
        <div>
          <p class="gym-brand-name">GymVe</p>
          <p class="gym-brand-sub">Fitness 24 Seven · San José de Bavaria</p>
        </div>
      </div>
      <form action="/logout" method="post">
        <button type="submit" class="gym-icon-btn" aria-label="Cerrar sesión">
          <i class="ti ti-logout"></i>
        </button>
      </form>
    </header>

    <main class="gym-main">
      {% block content %}{% endblock %}
    </main>

    <nav class="gym-bottom-nav" aria-label="Principal">
      <a href="/app/dashboard" class="gym-nav-item{% if active_tab == 'dashboard' %} active{% endif %}">
        <i class="ti ti-layout-dashboard"></i>
        <span>Inicio</span>
      </a>
      <a href="/app/workouts" class="gym-nav-item{% if active_tab == 'workouts' %} active{% endif %}">
        <i class="ti ti-barbell"></i>
        <span>Entrenamientos</span>
      </a>
      <a href="/app/exercises" class="gym-nav-item{% if active_tab == 'exercises' %} active{% endif %}">
        <i class="ti ti-list-details"></i>
        <span>Ejercicios</span>
      </a>
      <a href="/app/workouts#compartidos" class="gym-nav-item{% if active_tab == 'shared' %} active{% endif %}">
        <i class="ti ti-share"></i>
        <span>Compartidos</span>
      </a>
      <a href="/app/gym" class="gym-nav-item{% if active_tab == 'gym' %} active{% endif %}">
        <i class="ti ti-building"></i>
        <span>Mi gym</span>
      </a>
    </nav>
  </div>
  <script src="/static/app.js" defer></script>
  <script src="/static/app-gym.js?v=20260930b" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
